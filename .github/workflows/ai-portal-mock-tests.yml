name: Public Safe AI Portal Mock Tests

on:
  push:
    paths:
      - "showcases/ai-task-management-portal/**"
      - ".github/workflows/ai-portal-mock-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test only the synthetic mock
        run: python -m unittest discover -s showcases/ai-task-management-portal/tests -v
      - name: Display safe example
        run: python showcases/ai-task-management-portal/demo.py
