  </g>
  <g font-size="21" fill="#c8d8dc">
    <text x="119" y="775">Store receipt, decision and audit record.</text>
    <text x="842" y="775">Reconcile target state before any retry.</text>
  </g>
  <text x="95" y="862" font-size="19" fill="#afcbd7">Original conceptual illustration · Synthetic workflow · No production claims or private business records</text>
</g>
</svg>