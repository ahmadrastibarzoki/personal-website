  <text x="90" y="188" font-size="62" font-weight="700" fill="#f5f9fc">An approval is not execution.</text>
  <text x="93" y="241" font-size="30" fill="#c4d6e2">Bind the decision. Check the policy. Verify the outcome.</text>
  <path d="M95 318H1505" stroke="url(#line)" stroke-width="4" opacity=".64" />
  <g filter="url(#shadow)">
    <rect x="70" y="355" width="338" height="265" rx="25" fill="#f7fbfc"/>
    <rect x="445" y="355" width="338" height="265" rx="25" fill="#f7fbfc"/>
    <rect x="820" y="355" width="338" height="265" rx="25" fill="#f7fbfc"/>
    <rect x="1195" y="355" width="338" height="265" rx="25" fill="#f7fbfc"/>
  </g>
  <g font-size="19" font-weight="700">
    <rect x="92" y="380" width="72" height="45" rx="11" fill="#ddf5f5"/><text x="110" y="410" fill="#196d77">01</text>
    <rect x="467" y="380" width="72" height="45" rx="11" fill="#e5edf9"/><text x="485" y="410" fill="#315e90">02</text>
    <rect x="842" y="380" width="72" height="45" rx="11" fill="#fff2d9"/><text x="860" y="410" fill="#94611f">03</text>
    <rect x="1217" y="380" width="72" height="45" rx="11" fill="#dff6eb"/><text x="1235" y="410" fill="#1f7758">04</text>
  </g>
  <g font-size="31" font-weight="700" fill="#163049">
    <text x="92" y="475">AI proposal</text>
    <text x="467" y="475">Policy checks</text>
    <text x="842" y="475">Human review</text>
    <text x="1217" y="475">Action executor</text>
  </g>
  <g font-size="21" fill="#506675">
    <text x="92" y="519">What and why?</text>
    <text x="92" y="552">Evidence + target version</text>
    <text x="467" y="519">Who may act?</text>
    <text x="467" y="552">Identity + role + state</text>
    <text x="842" y="519">Approve or reject?</text>
    <text x="842" y="552">Scope + expiry</text>
    <text x="1217" y="519">Revalidate before write</text>
    <text x="1217" y="552">Idempotency + receipt</text>
  </g>
