  <rect x="91" y="683" width="685" height="125" rx="22" fill="#153c44" stroke="#4dc5bb" stroke-width="2"/>
  <rect x="814" y="683" width="695" height="125" rx="22" fill="#49382b" stroke="#e8ac65" stroke-width="2"/>
