<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Human-in-the-loop AI: from recommendation to authorized and recoverable action</title>
<desc id="desc">Original conceptual four-stage architecture diagram with an AI proposal, policy validation, authorized human review, a constrained executor and two outcome paths for an audit receipt or an unknown outcome requiring reconciliation. No real data or production metrics.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071728"/><stop offset=".57" stop-color="#122d44"/><stop offset="1" stop-color="#152b3b"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#68c9d5"/><stop offset=".5" stop-color="#a4d6db"/><stop offset="1" stop-color="#f1bf73"/></linearGradient>
  <filter id="shadow" x="-20%" y="-40%" width="140%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#040e18" flood-opacity=".35"/></filter>
  <pattern id="grid" width="78" height="78" patternUnits="userSpaceOnUse"><path d="M78 0H0V78" fill="none" stroke="#5e8daa" stroke-opacity=".08" stroke-width="1"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#grid)"/>
<circle cx="1415" cy="90" r="320" fill="#4cc8c9" opacity=".045"/>
<circle cx="125" cy="740" r="260" fill="#9e85d8" opacity=".05"/>
<g font-family="Arial, Helvetica, sans-serif">
