<title id="t">AI Task Management Portal: conceptual trust and approval gates</title>
<desc id="d">An original synthetic illustration of a proposed AI portal workflow: natural language, untrusted assistant proposal, read-only verification, policy checks, human approval, and a not-yet-activated restricted writer.</desc>
