<text x="90" y="191" font-family="Arial,sans-serif" font-size="52" font-weight="700" fill="#183c48">Validate before you trust.</text><text x="92" y="240" font-family="Arial,sans-serif" font-size="23" fill="#5a7c7c">Freshness · Uniqueness · Reconciliation</text>
